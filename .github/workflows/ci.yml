name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 21'e sabit: testler (Mockito/Byte Buddy) daha yeni JDK'larda kırılabilir.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Station Service — build + test
        run: mvn -B -f station-service/pom.xml verify

      - name: Session Service — build + test
        run: mvn -B -f session-service/pom.xml verify

      # İmajları kur (registry'ye push yok — sadece Dockerfile'ların derlendiğini doğrular).
      - name: Build station-service image
        run: docker build -t chargesquare/station-service:ci station-service

      - name: Build session-service image
        run: docker build -t chargesquare/session-service:ci session-service

  # Servisler arası gerçek uçtan uca test: iki servis de konteynerde ayağa kalkar,
  # akış gerçek HTTP üzerinden sürülür ve beklenen değerler doğrulanır (mock yok).
  e2e:
    name: Uçtan uca (iki servis, gerçek HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yerel ayarları hazırla
        run: cp .env.example .env

      - name: Servisleri ayağa kaldır
        run: docker compose up -d --build

      - name: Akışı doğrula (start → stop → fatura → cüzdan → release + guard'lar)
        run: ./scripts/demo.sh

      - name: Hata durumunda servis loglarını göster
        if: failure()
        run: docker compose logs --tail=120

      - name: Temizle
        if: always()
        run: docker compose down -v
