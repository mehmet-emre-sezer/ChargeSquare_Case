server:
  port: 8081

spring:
  application:
    name: station-service

  # Datasource ortamdan gelir: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD env değişkenleri
  # Spring Boot tarafından otomatik bağlanır (relaxed binding). Hardcode/secret yok.
  # Testlerde bağlantıyı gömülü Postgres (zonky) sağlar.

  jpa:
    hibernate:
      # Şema Flyway'in sorumluluğunda; Hibernate yalnızca eşlemeyi şemaya karşı doğrular.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: station
    open-in-view: false

  flyway:
    schemas: station
    default-schema: station

# JWT doğrulama anahtarı — Session Service ile aynı paylaşılan secret (ortamdan gelir).
jwt:
  secret: ${JWT_SECRET}

# Her serviste sade bir /health endpoint'i aç (readiness/liveness).
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true
