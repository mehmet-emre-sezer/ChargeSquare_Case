# One command to bring up the whole flow: docker compose up --build
# All config comes from .env (see .env.example). No secrets are baked into images.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # Gate dependents on a genuinely-ready DB, not just a started container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  station-service:
    build: ./station-service
    environment:
      # Station owns the 'station' schema inside the shared database.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?currentSchema=station
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${STATION_SERVICE_PORT}:8081"
    depends_on:
      db:
        condition: service_healthy

  session-service:
    build: ./session-service
    environment:
      # Session owns the 'session' schema inside the shared database.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?currentSchema=session
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Real network call target for the start/stop flow.
      STATION_SERVICE_URL: ${STATION_SERVICE_URL}
    ports:
      - "${SESSION_SERVICE_PORT}:8082"
    depends_on:
      db:
        condition: service_healthy
      station-service:
        condition: service_started

volumes:
  db-data:
