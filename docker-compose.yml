# Tüm akışı tek komutla ayağa kaldır: docker compose up --build
# Tüm config .env'den gelir (bkz. .env.example). İmajlara hiçbir secret gömülmez.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # Bağımlıları sadece başlamış değil, gerçekten hazır bir DB'ye bağla.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  station-service:
    build: ./station-service
    environment:
      # Station, paylaşımlı veritabanındaki 'station' şemasına sahip.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?currentSchema=station
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # JWT doğrulama anahtarı (Session ile paylaşılan aynı secret).
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${STATION_SERVICE_PORT}:8081"
    depends_on:
      db:
        condition: service_healthy

  session-service:
    build: ./session-service
    environment:
      # Session, paylaşımlı veritabanındaki 'session' şemasına sahip.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?currentSchema=session
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Start/stop akışı için gerçek ağ çağrısı hedefi.
      STATION_SERVICE_URL: ${STATION_SERVICE_URL}
      # JWT imzalama anahtarı (login token üretir; Station ile paylaşılır).
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${SESSION_SERVICE_PORT}:8082"
    depends_on:
      db:
        condition: service_healthy
      station-service:
        condition: service_started

volumes:
  db-data:
