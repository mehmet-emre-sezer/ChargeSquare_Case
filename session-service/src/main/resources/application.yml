server:
  port: 8082

spring:
  application:
    name: session-service

  # Datasource ortamdan gelir: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD env değişkenleri
  # Spring Boot tarafından otomatik bağlanır (relaxed binding). Hardcode/secret yok.
  # Testlerde bağlantıyı gömülü Postgres (zonky) sağlar.

  jpa:
    hibernate:
      # Şema Flyway'in sorumluluğunda; Hibernate yalnızca eşlemeyi şemaya karşı doğrular.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: session
    open-in-view: false

  flyway:
    schemas: session
    default-schema: session

# Station Service temel URL'i — start/stop yolundaki gerçek senkron çağrı hedefi.
station:
  service:
    url: ${STATION_SERVICE_URL}

# Her serviste sade bir /health endpoint'i aç (readiness/liveness).
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      probes:
        enabled: true
