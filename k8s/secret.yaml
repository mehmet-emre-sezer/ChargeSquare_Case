# DB kimlik bilgileri. Bu dosyadaki değerler PLACEHOLDER'dır — gerçek ortamda
# değerler bir secret yöneticisinden (ör. Sealed Secrets / External Secrets) gelir,
# repoya asla gerçek secret konmaz.
apiVersion: v1
kind: Secret
metadata:
  name: chargesquare-db
type: Opaque
stringData:
  POSTGRES_USER: chargesquare
  POSTGRES_PASSWORD: change_me_in_real_secret_store
